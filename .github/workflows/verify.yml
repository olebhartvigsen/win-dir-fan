name: Verify build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check packaging script syntax
        shell: pwsh
        run: |
          foreach ($script in @("Build-MSIX.ps1", "Build-And-Test-MSIX.ps1")) {
            $tokens = $null
            $errors = $null
            $path = Join-Path $PWD "installer/msix/$script"
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw ($errors | Out-String)
            }
          }
      - name: Configure
        run: cmake -S FanFolder -B build-verify -G "Visual Studio 17 2022" -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build-verify --config Release
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path build-verify/Release/FanFolder.exe)) {
            throw "FanFolder.exe was not built"
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FanFolder-verify-${{ matrix.arch }}
          path: build-verify/Release/FanFolder.exe
          if-no-files-found: error
