name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build FanFolder (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: arm64
            cmake_arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET (for WiX)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Install WiX toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Add WiX UI extension
        working-directory: installer
        run: |
          wix extension add WixToolset.UI.wixext/4.0.5
          wix extension add WixToolset.Util.wixext/4.0.5

      - name: Configure CMake
        run: cmake -B FanFolder/build -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} -S FanFolder

      - name: Build Release exe
        run: cmake --build FanFolder/build --config Release

      - name: Build MSI installer
        working-directory: installer
        run: >
          dotnet build FanFolder.wixproj -c Release
          -p:Platform=${{ matrix.arch }}
          -p:ProductVersion=${{ steps.version.outputs.VERSION }}
          -p:OutputName=FanFolderSetup-${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: |
            FanFolder/build/Release/FanFolder.exe
            installer/output/FanFolderSetup-${{ matrix.arch }}.msi

      - name: Upload EXE for MSIX (renamed)
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.arch }}
          path: FanFolder/build/Release/FanFolder.exe

  build-msix:
    name: Build MSIX packages
    runs-on: windows-2022
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            MSIX_VERSION="${VERSION}.0"
            echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "MSIX_VERSION=${MSIX_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=0.0.0" >> "$GITHUB_OUTPUT"
            echo "MSIX_VERSION=0.0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Download x64 EXE
        uses: actions/download-artifact@v4
        with:
          name: exe-x64
          path: msix-staging/x64

      - name: Download arm64 EXE
        uses: actions/download-artifact@v4
        with:
          name: exe-arm64
          path: msix-staging/arm64

      - name: Prepare MSIX manifest
        shell: bash
        run: |
          mkdir -p msix-staging
          cp installer/msix/AppxManifest.xml msix-staging/AppxManifest.xml
          sed -i 's/Version="[^"]*"/Version="${{ steps.version.outputs.MSIX_VERSION }}"/' msix-staging/AppxManifest.xml

      - name: Generate MSIX assets from icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icoPath = "FanFolder/resources/app.ico"
          $assets = @{
            "StoreLogo.png"    = @{W=50;  H=50}
            "Logo44.png"       = @{W=44;  H=44}
            "Logo71.png"       = @{W=71;  H=71}
            "Logo150.png"      = @{W=150; H=150}
            "Logo310.png"      = @{W=310; H=310}
            "Wide310x150.png"  = @{W=310; H=150}
            "SplashScreen.png" = @{W=620; H=300}
          }
          foreach ($arch in @("x64","arm64")) {
            $assetsDir = "msix-staging/$arch/assets"
            New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
            $ico = [System.Drawing.Icon]::new($icoPath)
            foreach ($kv in $assets.GetEnumerator()) {
              $name = $kv.Key; $w = $kv.Value.W; $h = $kv.Value.H
              $dest = "$assetsDir/$name"
              $bmp = New-Object System.Drawing.Bitmap $w, $h
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $g.Clear([System.Drawing.Color]::Transparent)
              $g.DrawImage($ico.ToBitmap(), 0, 0, $w, $h)
              $g.Dispose()
              $bmp.Save($dest, [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
            }
            $ico.Dispose()
          }

      - name: Copy manifest to staging dirs
        shell: bash
        run: |
          cp msix-staging/AppxManifest.xml msix-staging/x64/AppxManifest.xml
          cp msix-staging/AppxManifest.xml msix-staging/arm64/AppxManifest.xml

      - name: Find latest Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $latest = (Get-ChildItem $sdkRoot -Directory | Where-Object Name -like "10.0.*" | Sort-Object Name -Descending | Select-Object -First 1).Name
          $makeAppx = Join-Path $sdkRoot "$latest/x64/makeappx.exe"
          if (-not (Test-Path $makeAppx)) {
            $makeAppx = Join-Path $sdkRoot "$latest/x86/makeappx.exe"
          }
          echo "MAKEAPPX=$makeAppx" >> $env:GITHUB_OUTPUT
        id: sdk

      - name: Pack MSIX (x64)
        shell: pwsh
        run: |
          & "${{ steps.sdk.outputs.MAKEAPPX }}" pack -d msix-staging/x64 -p msix-staging/FanFolder-x64.msix
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pack MSIX (arm64)
        shell: pwsh
        run: |
          & "${{ steps.sdk.outputs.MAKEAPPX }}" pack -d msix-staging/arm64 -p msix-staging/FanFolder-arm64.msix
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix-packages
          path: |
            msix-staging/FanFolder-x64.msix
            msix-staging/FanFolder-arm64.msix

  bundle:
    name: Create combined installer
    runs-on: windows-2022
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET (for WiX)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Install WiX toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Add WiX Bal extension
        working-directory: installer
        run: |
          wix extension add WixToolset.Bal.wixext/4.0.5
          wix extension add WixToolset.Util.wixext/4.0.5

      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: artifacts/x64

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-arm64
          path: artifacts/arm64

      - name: Build Burn bundle
        working-directory: installer/bundle
        run: >
          dotnet build FanFolderBundle.wixproj -c Release
          -p:ProductVersion=${{ steps.version.outputs.VERSION }}

      - name: Prepare release assets
        shell: bash
        run: |
          cp "artifacts/x64/FanFolder/build/Release/FanFolder.exe" "artifacts/x64/FanFolder-x64.exe"
          cp "artifacts/arm64/FanFolder/build/Release/FanFolder.exe" "artifacts/arm64/FanFolder-arm64.exe"

      - name: Generate winget manifests
        shell: pwsh
        run: |
          $isRelease = $env:GITHUB_EVENT_NAME -eq "release"
          $sha = git rev-parse --short HEAD
          $tag = if ($isRelease) { "${{ github.ref_name }}" } else { "dev-$sha" }
          scripts/generate-winget-manifests.ps1 `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -Tag $tag

      - name: Sync winget templates back to source repo
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p installer/winget
          cp winget-manifests/*.yaml installer/winget/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/winget/*.yaml
          if git diff --cached --quiet; then
            echo "Templates already in sync."
            exit 0
          fi
          git commit -m "Sync winget manifest templates for ${{ github.ref_name }}"
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            if git rebase "origin/$DEFAULT_BRANCH"; then
              if git push origin "HEAD:${DEFAULT_BRANCH}"; then
                echo "Synced winget templates on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Sync attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "::warning::Could not sync winget templates back to master after 3 attempts."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download MSIX artifacts
        uses: actions/download-artifact@v4
        with:
          name: msix-packages
          path: artifacts/msix

      - name: Publish release to distribution repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO: olebhartvigsen/FanFolder
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="FanFolder ${{ steps.version.outputs.VERSION }}"
            PRERELEASE=""
          else
            SHA=$(git rev-parse --short HEAD)
            TAG="dev-${SHA}"
            TITLE="Dev build (${SHA})"
            PRERELEASE="--prerelease"
          fi

          gh release create "$TAG" \
            --repo "$DIST_REPO" \
            --title "$TITLE" \
            $PRERELEASE \
            --notes "Built from [win-dir-fan](https://github.com/olebhartvigsen/win-dir-fan) @ \`${SHA:-${{ github.ref_name }}}\`" \
            2>/dev/null || true

          gh release upload "$TAG" \
            --repo "$DIST_REPO" \
            --clobber \
            "artifacts/x64/FanFolder-x64.exe" \
            "artifacts/arm64/FanFolder-arm64.exe" \
            "artifacts/x64/installer/output/FanFolderSetup-x64.msi" \
            "artifacts/arm64/installer/output/FanFolderSetup-arm64.msi" \
            "installer/bundle/output/FanFolderSetup.exe" \
            "artifacts/msix/FanFolder-x64.msix" \
            "artifacts/msix/FanFolder-arm64.msix" \
            "winget-manifests/OleBhartvigsen.FanFolder.yaml" \
            "winget-manifests/OleBhartvigsen.FanFolder.installer.yaml" \
            "winget-manifests/OleBhartvigsen.FanFolder.locale.en-US.yaml"
